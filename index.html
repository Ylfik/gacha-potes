<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4B3121"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gacha entre potes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Univers de jeu mobile : bandeau en bois, panneaux parchemin pour l'album et l'équipe, scène de combat carrée en pixel art */
:root{
  --bg:#1A1310; --bg-2:#241A15; --wood:#4B3121; --wood-2:#6C462A; --wood-3:#8E5E36; --wood-hi:#B98A55;
  --parch:#EBDDBB; --parch-2:#DFCB9F; --parch-3:#C7AC78; --pink:#3A2717; --pmuted:#7B6249;
  --ink:#F5EBD6; --muted:#BCA98D; --line:#5C4330;
  --accent:#E8673E; --accent-ink:#2A1006; --gold:#F2C14B; --gold-ink:#3A2700;
  --el-coeur:#E8508A; --el-raison:#3F86E6; --el-delire:#EE9A1E; --el-prudence:#2BB27E; --el-ordre:#8C97AE; --el-chaos:#9659E0;
  --r-C:#8E94A6; --r-R:#3F8FE8; --r-E:#A25BE6; --r-L:#F0B52E;
  --good:#58D26A; --bad:#F0544A; --gauge:#6AB4FF; --shield:#B9D6F5;
  --font-display:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.outline{text-shadow:-1.5px -1.5px 0 #2a1709,1.5px -1.5px 0 #2a1709,-1.5px 1.5px 0 #2a1709,1.5px 1.5px 0 #2a1709,0 3px 0 #2a1709}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--wood-2),var(--wood));border-bottom:3px solid #2a1709;box-shadow:0 2px 0 var(--wood-hi) inset}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:23px;margin-right:auto;line-height:1;color:var(--gold)}
.wallet{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coin{display:flex;align-items:center;gap:6px;background:#2a1709;border-radius:999px;padding:3px 12px 3px 4px;border:2px solid #120a04}
.coin i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--gold-ink)}
.coin.g i{background:var(--gold)} .coin.t i{background:#7FD3F7} .coin.f i{background:#E8673E;color:#fff}
.coin b{font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums}
.coin span{font-size:11px;color:var(--muted)}
.bank{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bank b{color:var(--ink);font-family:var(--font-mono)}
nav.tabs{display:flex;gap:6px;padding-block:6px 8px;overflow-x:auto}
nav.tabs button{border:2px solid #2a1709;background:linear-gradient(var(--wood-3),var(--wood-2));padding:5px 16px;border-radius:10px;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--parch);white-space:nowrap;box-shadow:0 3px 0 #2a1709}
nav.tabs button[aria-selected="true"]{background:linear-gradient(#f6d77a,var(--gold));color:var(--gold-ink)}
main{padding-block:16px 48px}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance;line-height:1.1}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 8px;font-weight:800}
.btn{border:2px solid #2a1709;background:linear-gradient(var(--wood-3),var(--wood-2));color:var(--parch);padding:7px 14px;border-radius:10px;font-family:var(--font-display);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 #2a1709}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1709}
.btn.primary{background:linear-gradient(#ff9a6b,var(--accent));color:#fff;text-shadow:0 1px 0 #7a2a10}
.btn.gold{background:linear-gradient(#ffe08a,var(--gold));color:var(--gold-ink)}
.btn.small{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.seg{display:inline-flex;border:2px solid #2a1709;border-radius:10px;overflow:hidden;box-shadow:0 2px 0 #2a1709}
.seg button{border:0;background:var(--wood-2);padding:5px 10px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--parch)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.parch{background:radial-gradient(ellipse at 50% 0%,#f6ecd2,var(--parch) 55%,var(--parch-2));color:var(--pink);border:3px solid var(--wood);border-radius:14px;box-shadow:0 0 0 3px #2a1709,inset 0 0 30px rgba(140,100,50,.25);padding:16px}
.parch .muted{color:var(--pmuted)}
.parch h3{color:var(--pmuted)}
.panel{background:var(--bg-2);border:2px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ribbon{display:block;text-align:center;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--pink);margin:6px auto 12px;position:relative;max-width:420px;background:linear-gradient(90deg,transparent,var(--parch-3) 15%,var(--parch-3) 85%,transparent);padding:4px 10px}

/* éléments, raretés */
.el-coeur{--el:var(--el-coeur)} .el-raison{--el:var(--el-raison)} .el-delire{--el:var(--el-delire)} .el-prudence{--el:var(--el-prudence)} .el-ordre{--el:var(--el-ordre)} .el-chaos{--el:var(--el-chaos)}
.r-C{--rar:var(--r-C)} .r-R{--rar:var(--r-R)} .r-E{--rar:var(--r-E)} .r-L{--rar:var(--r-L)}
.emb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 50%),var(--el);border:2px solid #2a1709;color:#fff;font-size:11px;line-height:1;font-weight:800;box-shadow:0 0 0 1.5px var(--gold)}

/* Album : bannières */
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 10px}
.banner{all:unset;cursor:pointer;display:grid;gap:4px;justify-items:center;position:relative}
.banner:focus-visible{outline:3px solid var(--wood-3);outline-offset:3px;border-radius:6px}
.banner .frame{width:100%;aspect-ratio:1/2.05;padding:4px;background:linear-gradient(var(--rar),color-mix(in srgb,var(--rar) 55%,#2a1709));clip-path:polygon(0 0,100% 0,100% 90%,50% 100%,0 90%);position:relative}
.banner .art{width:100%;height:100%;clip-path:polygon(0 0,100% 0,100% 90%,50% 100%,0 90%);background:linear-gradient(170deg,color-mix(in srgb,var(--el) 55%,#fff8e6),color-mix(in srgb,var(--el) 35%,#2a1709));display:grid;place-items:center;overflow:hidden;position:relative}
.banner .art img.full{width:100%;height:100%;object-fit:cover}
.banner .art img.px{width:74%;height:auto}
.banner .emb{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:26px;height:26px;font-size:13px;z-index:1}
.banner .stars{position:absolute;bottom:13%;left:0;right:0;text-align:center;color:var(--gold);font-size:12px;letter-spacing:1px;text-shadow:0 1px 0 #2a1709}
.banner .no{position:absolute;top:6px;left:8px;font-family:var(--font-mono);font-size:10px;color:#fff;text-shadow:0 1px 0 #000}
.banner .nm{font-family:var(--font-display);font-weight:600;font-size:13.5px;line-height:1.15;text-align:center;color:var(--pink)}
.banner.missing .art{filter:sepia(1) saturate(.35) brightness(.8)}
.banner.missing .art::after{content:"Pas obtenue";position:absolute;top:42%;left:0;right:0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;text-shadow:0 1px 2px #000}
.banner.missing .frame{background:linear-gradient(#b9a37a,#8c7652)}
.banner .badge{position:absolute;top:8px;right:4px;z-index:2}
.tier{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.tier::before,.tier::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--parch-3))}
.tier::after{background:linear-gradient(90deg,var(--parch-3),transparent)}
.tier span{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--pink);background:var(--parch-2);border:2px solid var(--parch-3);padding:3px 16px;border-radius:8px}

/* Icônes carrées (équipe, invocation) */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.ico{all:unset;cursor:pointer;display:grid;gap:3px;justify-items:center;position:relative}
.ico:focus-visible{outline:3px solid var(--wood-3);outline-offset:3px;border-radius:8px}
.ico .sq{width:100%;aspect-ratio:1;border-radius:6px 6px 18px 6px;padding:3px;background:linear-gradient(135deg,color-mix(in srgb,var(--rar) 80%,#fff),var(--rar) 40%,color-mix(in srgb,var(--rar) 60%,#2a1709));position:relative;box-shadow:0 3px 0 #2a1709}
.ico button.sq{border:0;cursor:pointer;display:block;font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ico .sq img{-webkit-user-drag:none;pointer-events:none}
.ico .sq .in{width:100%;height:100%;border-radius:4px 4px 15px 4px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--el) 45%,#2b2440),#15111d);display:grid;place-items:center}
.ico .sq .in img.full{width:100%;height:100%;object-fit:cover}
.ico .sq .in img.px{width:64%;height:auto}
.ico .emb{position:absolute;top:-6px;left:-6px;z-index:1}
.ico .stars{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:var(--gold);font-size:11px;letter-spacing:.5px;text-shadow:0 1px 0 #000,0 0 3px #000}
.ico .lv{position:absolute;top:3px;right:5px;font-family:var(--font-display);font-weight:700;font-size:11px;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
.ico .nm{font-family:var(--font-display);font-weight:600;font-size:12.5px;text-align:center;line-height:1.1}
.ico .fams{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.ico .fams i{font-style:normal;font-size:9.5px;font-weight:800;padding:0 5px;border-radius:4px;background:var(--parch-2);color:var(--pmuted);border:1px solid var(--parch-3)}
.ico .fams i.on{background:#cfe8b8;color:#2f6a1d;border-color:#8cbf6a}
.ico .fams i.hl{background:var(--pink);color:var(--parch);border-color:var(--pink)}
.ico.inteam .sq::after{content:"Équipe";font-size:13px !important;align-content:end;padding-bottom:16px;position:absolute;inset:3px;border-radius:4px 4px 15px 4px;background:rgba(20,12,6,.55);display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--good)}
.ico .info{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:2px solid #2a1709;background:var(--good);color:#10300f;font-weight:800;font-size:17px;line-height:1;display:grid;place-items:center;z-index:2;font-family:var(--font-display);box-shadow:0 2px 0 #2a1709}
.ico.inteam .info{background:var(--bad);color:#fff}
.ico .badge{position:absolute;top:-8px;right:-4px;z-index:2}
.badge-new,.badge-up{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;border:1.5px solid #2a1709;white-space:nowrap}
.badge-new{background:var(--accent);color:#fff} .badge-up{background:var(--gold);color:var(--gold-ink)}
.parch .ico .nm{color:var(--pink)}

/* Combat */
.battle{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.battle{grid-template-columns:minmax(0,540px) 1fr}}
.scene{position:relative;width:100%;max-width:540px;aspect-ratio:4/5;border-radius:14px;border:3px solid #2a1709;box-shadow:0 0 0 3px var(--wood-3);overflow:hidden;background:#3b2a4f center/cover no-repeat;image-rendering:pixelated;margin-inline:auto}
.scene .hud{position:absolute;inset:8px 8px auto;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:40}
.scene .hud .pill{background:rgba(26,15,8,.78);border:2px solid #2a1709;border-radius:999px;padding:2px 12px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--parch)}
.scene .hud .rbtn{width:40px;height:40px;border-radius:50%;border:3px solid #2a1709;background:radial-gradient(circle at 40% 35%,var(--wood-hi),var(--wood-2));color:var(--parch);font-family:var(--font-display);font-weight:700;font-size:13px;box-shadow:0 2px 0 #2a1709;display:grid;place-items:center}
.scene .hud .rbtn:disabled{opacity:.5}
.u{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .4s}
.u .bars{width:58px;display:grid;gap:1px}
.u .bar{height:6px;background:#1a0f08;border:1px solid #1a0f08;position:relative;overflow:hidden;border-radius:2px}
.u .bar>span{position:absolute;inset:0 auto 0 0;background:var(--good)}
.u.side1 .bar.h>span.hp{background:var(--bad)}
.u .bar>span.sh{background:var(--shield)}
.u .bar.ul{height:3px}.u .bar.ul>span{background:var(--gold)}
.u .bar.g{height:3px}.u .bar.g>span{background:var(--gauge)}
.u .spr{display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.u.side1 .spr{transform:scaleX(-1)}
.u .spr{animation:bob 1.3s steps(2,jump-none) infinite}
.u.side1 .spr{animation-name:bob1}
.u:nth-child(2n) .spr{animation-delay:-.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes bob1{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-2px)}}
.u .shadow{width:46px;height:8px;background:rgba(0,0,0,.32);border-radius:50%;margin-top:-5px}
.u .st{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:11px;max-width:86px}
.u .st span{font-size:8.5px;font-weight:800;padding:0 3px;border-radius:2px;background:rgba(20,10,4,.78);color:var(--good)}
.u .st span.neg{color:#ff9a8a}
.u.dead{opacity:.15;filter:grayscale(1)}
.u.absent{opacity:0;pointer-events:none}
.fl{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-weight:700;font-size:17px;pointer-events:none;animation:fl .8s ease-out forwards;white-space:nowrap;z-index:50}
.fl.dmg{color:#fff}.fl.heal{color:var(--good)}.fl.neg{color:#ffb0a3;font-size:12px}.fl.pos{color:#9cf0a6;font-size:12px}.fl.info,.fl.miss{color:#e9dfc6;font-size:12px}
.fl.skill{color:var(--gold);font-size:14px;top:-22px}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-28px);opacity:0}}
.strip{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:linear-gradient(transparent,rgba(20,10,4,.85) 30%);z-index:41}
.strip .p{display:grid;gap:2px}
.strip .p .face{aspect-ratio:1;border-radius:5px;border:2px solid var(--rar);overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--el) 45%,#2b2440),#15111d);display:grid;place-items:center;position:relative}
.strip .p .face img.full{width:100%;height:100%;object-fit:cover}
.strip .p .face img.px{width:62%}
.strip .p .face b{position:absolute;bottom:0;left:0;right:0;font-size:9.5px;text-align:center;background:rgba(0,0,0,.55);color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .p .bar{height:5px;background:#1a0f08;border-radius:2px;overflow:hidden;position:relative}
.strip .p .bar span{position:absolute;inset:0 auto 0 0;background:var(--good)}
.strip .p .bar.ul span{background:var(--gold)}
.strip .p.dead{opacity:.35;filter:grayscale(1)}
.strip .p.empty .face{border-style:dashed;border-color:#6b5a48;background:rgba(0,0,0,.3)}
.side-panel{display:grid;gap:12px;align-content:start}
.floorsel{display:flex;align-items:center;gap:8px}
.floorsel .big{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;min-width:130px;text-align:center}
.foes-preview{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--rar);border-radius:8px;padding:2px 8px 2px 2px;font-size:12px;font-weight:700;background:var(--bg)}
.chip .mini{width:24px;height:24px;border-radius:4px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--el) 45%,#2b2440),#15111d)}
.chip .mini img.full{width:100%;height:100%;object-fit:cover}
.chip .mini img.px{width:70%}
details.log summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
.logl{margin-top:8px;font-size:13px;display:grid;gap:2px;max-height:220px;overflow:auto}
.logl div{padding:3px 0;border-bottom:1px solid var(--line)}
.logl .ult{font-weight:700;color:var(--gold)}
.s0{color:#7fe0a8} .s1{color:#ff9a8a}
.result{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg-2);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.result.win{border-color:var(--good)} .result.lose{border-color:var(--bad)}
.result b{font-family:var(--font-display);font-size:20px}

/* Équipe : socles */
.team-top{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end;padding:10px 4px 4px;border-radius:12px;background:linear-gradient(#efe2c3,#e3cfa3)}
.ped{position:relative;display:grid;justify-items:center;gap:4px;min-width:0;border-radius:10px;transition:background .15s}
.pedbtn{all:unset;cursor:grab;display:grid;justify-items:center;gap:4px;width:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pedbtn:focus-visible{outline:3px solid var(--wood-3);border-radius:8px}
.ped.over{background:rgba(255,214,120,.45);box-shadow:0 0 0 3px var(--gold)}
.ped .x{position:absolute;top:2px;right:4px;width:24px;height:24px;border-radius:50%;border:2px solid #2a1709;background:var(--bad);color:#fff;font-weight:800;font-size:15px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 0 #2a1709}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-70%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.ghost img{height:96px;width:auto}
.dragging{opacity:.35}
body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(8,5,3,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px));cursor:zoom-out}
.lightbox>img{max-width:100%;max-height:78vh;border-radius:10px;border:4px solid var(--el);box-shadow:0 0 40px rgba(0,0,0,.6)}
.lightbox .pxbig{padding:24px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--el) 45%,#2b2440),#15111d);border:4px solid var(--el)}
.lightbox .pxbig img{max-width:80vw;width:auto}
.lightbox .cap{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--parch)}
.artbtn{cursor:zoom-in}
.sheet .artbtn .banner{pointer-events:none}
.ped .fig{height:150px;display:flex;align-items:flex-end;justify-content:center}

class Battle{
 constructor(teamA,teamB,seed){
  this.seed=(seed==null?Math.floor(Math.random()*2147483647):seed)>>>0;this.rand=mulberry(this.seed);this.rnd=n=>Math.floor(this.rand()*n);
  this.t=0;this.log=[];this.events=[];this.fx=[];this.queue=[];this.over=false;this.winner=null;this.units=[];
  this.sides=[{actions:0,syn:{},lastAttacker:null},{actions:0,syn:{},lastAttacker:null}];
  teamA.forEach(c=>this.add(c,0));teamB.forEach(c=>this.add(c,1));
  [0,1].forEach(s=>{
   const side=this.sides[s],us=this.units.filter(u=>u.side===s);side.syn=famCounts(us.map(u=>u.id));const y=side.syn;
   let atk=1,hp=1,spd=1,dodge=0;
   if((y.potes||0)>=5)atk*=1.25;else if((y.potes||0)>=3)atk*=1.10;
   if((y.quotidien||0)>=5)atk*=1.20;else if((y.quotidien||0)>=3)atk*=1.10;
   if((y.lents||0)>=3)hp*=1.4;else if((y.lents||0)>=2)hp*=1.2;
   if((y.corvee||0)>=4)hp*=1.3;else if((y.corvee||0)>=2)hp*=1.15;
   if((y.poste||0)>=2)spd*=1.2;
   if((y.nuisibles||0)>=2)dodge+=0.1;
   us.forEach(u=>{u.atkMul*=atk;u.maxhp=Math.round(u.maxhp*hp);u.hp=u.maxhp;u.spdMul*=spd;u.dodge+=dodge;u.alone=u.id==='chaussette'&&us.filter(x=>x.d.fam.includes('quotidien')).length===1;});
  });
  [0,1].forEach(s=>{
   const y=this.sides[s].syn,us=this.units.filter(u=>u.side===s),foes=this.units.filter(u=>u.side!==s&&u.present);
   us.forEach(u=>{
    if(u.id==='lundi'){this.say(`${this.nm(u)} : Flemme générale en face.`);foes.forEach(t=>this.apply(u,t,'flemme',50));}
    if(u.id==='file'&&foes.length){const t=foes.reduce((a,c)=>this.spd(a)>this.spd(c)?a:c);this.say(`${this.nm(u)} : « Veuillez patienter. »`);this.apply(u,t,'attente',40);}
   });
   const src=us[0];if(!src)return;
   if((y.matin||0)>=2)foes.forEach(t=>this.apply(src,t,'flemme',40));
   if((y.relous||0)>=2&&foes.length)this.apply(src,foes[this.rnd(foes.length)],'stress',50);
   if((y.lignee||0)>=2)us.filter(u=>u.present).forEach(a=>this.apply(src,a,'calin',50));
  });
 }
 add(c,side){
  const d=CARD[c.id],m=statMult(c.lvl||1,c.stars||0);
  const u={uid:this.units.length,id:c.id,d,side,lvl:c.lvl||1,stars:c.stars||0,maxhp:Math.round(d.hp*8*m),atk0:d.atk*m,spd0:d.spd,hp:0,gauge:RETARD.has(c.id)?0:100+this.rand()*450,alive:true,present:!RETARD.has(c.id),st:{},colere:0,shield:0,cd:2,charge:0,uses:0,acts:0,atkMul:1,spdMul:1,dodge:c.id==='souris'?0.25:0,immune:new Set(c.id==='yoann'?['angoisse','malaise','stress']:c.id==='geoffrey'?['malaise','angoisse']:[]),once:false,discreet:c.id==='lila',cagnotte:0,stacks:0,confused:false,colle:null,alone:false};
  u.hp=u.maxhp;this.units.push(u);
 }

 say(html,cls){this.log.push({html,cls:cls||''});if(this.log.length>80)this.log.shift();}
 ev(u,text,kind){this.events.push({uid:u.uid,text,kind});}
 atk(u){return u.atk0*u.atkMul*(1+0.1*u.colere)*(u.st.double?2:1)*(1+0.1*u.stacks);}
 spd(u){return u.spd0*u.spdMul*(u.st.hype?1.3:1)*(u.st.flemme?0.7:1)*(1+0.1*u.stacks);}
 foes(u){return this.units.filter(x=>x.side!==u.side&&x.alive&&x.present);}
 allies(u){return this.units.filter(x=>x.side===u.side&&x.alive&&x.present);}
 hidden(x){if(x.st.cachee)return true;if(x.discreet)return this.units.some(y=>y.side===x.side&&y!==x&&y.alive&&y.present&&!y.discreet);return false;}
 visible(u){const f=this.foes(u),v=f.filter(x=>!this.hidden(x));return v.length?v:f;}
 mostHurt(u){const a=this.allies(u);if(!a.length)return u;return a.reduce((p,c)=>c.hp/c.maxhp<p.hp/p.maxhp?c:p);}
 pick(u,o={}){
  if(u.confused){u.confused=false;const p=this.units.filter(x=>x.alive&&x.present&&x!==u);return p.length?p[this.rnd(p.length)]:null;}
  const f=this.foes(u);if(!f.length)return null;
  const prov=f.filter(x=>x.st.provoc);if(prov.length)return prov[this.rnd(prov.length)];
  const v=o.pierce?f:this.visible(u);return v[this.rnd(v.length)];
 }
 hit(s,t,mult,o={}){
  if(!t||!t.alive)return 0;
  this.fx.push({k:'hit',from:s.uid,to:t.uid});
  if(s.id==='bug'&&this.units.some(x=>x.id==='kylian'&&x.side!==s.side&&x.alive&&x.present)&&this.rand()<0.4){this.ev(t,'Raté','miss');return 0;}
  if(!o.pierce&&t.dodge>0&&this.rand()<t.dodge){this.ev(t,'Esquive','miss');return 0;}
  let dmg=this.atk(s)*mult*elemMult(s.d.el,t.d.el);
  if(t.st.angoisse)dmg*=1.25;
  if(s.id==='impots'&&t.id==='kylian')dmg*=1.5;
  dmg=Math.max(1,Math.round(dmg*(0.9+this.rand()*0.2)));
  if(t.shield>0&&!o.pierce){const a=Math.min(t.shield,dmg);t.shield-=a;dmg-=a;if(a>0&&dmg===0){this.ev(t,'Bloqué','info');}}
  if(dmg>0)this.damage(t,dmg,s);
  if(t.alive){if(CHARGE.has(t.id))t.charge=Math.min(100,t.charge+10);if(t.id==='lea')t.colere=Math.min(10,t.colere+1);if(t.id==='yuumi')t.st.cachee={t:20};}
  if(s.side!==t.side)this.sides[t.side].lastAttacker=s;
  if(s.id==='impots'&&dmg>0){const a=this.mostHurt(s);if(a)this.heal(a,dmg*0.3,{silent:true});}
  if(s.id==='kylian')s.cagnotte+=dmg*0.3;
  return dmg;
 }
 damage(t,dmg,src){
  t.hp-=dmg;this.ev(t,'-'+dmg,'dmg');
  if(t.hp<=0){if(t.id==='yoann'&&!t.once){t.once=true;t.hp=1;t.shield+=Math.round(t.maxhp*0.3);this.say(`${this.nm(t)} est Inébranlable. Il tient à 1 PV.`,'ult');}else this.kill(t);}
 }
 kill(t){
  t.alive=false;t.hp=0;this.say(`${this.nm(t)} est K.O.`);
  if(t.id==='collegue'&&t.colle&&t.colle.st.flemme&&t.colle.st.flemme.src===t)delete t.colle.st.flemme;
  this.units.filter(x=>x.side===t.side&&x.alive).forEach(x=>{
   if(x.id==='lila'&&!x.once){x.once=true;x.discreet=false;x.atkMul*=1.6;this.say(`${this.nm(x)} n'est plus du tout timide.`,'ult');}
  });
  if(t.d.fam.includes('foyer')&&(this.sides[t.side].syn.foyer||0)>=2)this.units.filter(x=>x.side===t.side&&x.alive&&x.d.fam.includes('foyer')).forEach(x=>{x.colere=Math.min(10,x.colere+2);this.ev(x,'+2 Colère','pos');});
 }
 heal(t,amt,o={}){
  if(!t||!t.alive)return;
  if(t.st.piece){delete t.st.piece;this.ev(t,'Soin annulé','neg');return;}
  if(!o.queued&&this.units.some(x=>x.id==='assurance'&&x.side===t.side&&x.alive)){this.queue.push({at:this.t+20,u:t,amt:amt*2});if(!o.silent)this.ev(t,'Dossier en cours','info');return;}
  if(t.st.deprime)amt*=0.5;
  if((this.sides[t.side].syn.sante||0)>=2)amt*=1.3;
  amt=Math.round(amt);if(amt<=0)return;t.hp=Math.min(t.maxhp,t.hp+amt);this.ev(t,'+'+amt,'heal');
 }
 apply(s,t,name,dur,noRenvoi){
  if(!t||!t.alive)return false;
  if(NEG.has(name)){
   if(t.immune.has(name)){this.ev(t,'Immunisé','info');return false;}
   if(t.st.zen){this.ev(t,'Zen','info');return false;}
   if(t.id==='echo'&&s&&s.side!==t.side&&s.alive&&!noRenvoi){this.say(`${this.nm(t)} miaule et renvoie ${ST_LABEL[name]} à ${this.nm(s)}.`);return this.apply(t,s,name,dur,true);}
   const y=s?this.sides[s.side].syn:{};
   if((y.paperasse||0)>=2)dur*=1.3;
   if(name==='malaise'&&(y.bruyants||0)>=2)dur*=1.4;
   if(name==='attente'&&(y.numerique||0)>=2)dur*=1.5;
   if(name==='malaise')this.units.filter(x=>x.id==='geoffrey'&&x.side!==t.side&&x.alive).forEach(g=>{g.st.hype={t:30};});
  }
  const cur=t.st[name];
  t.st[name]={t:Math.max(cur?cur.t:0,Math.round(dur)),src:s,mul:(name==='stress'&&s&&(this.sides[s.side].syn.boulot||0)>=2)?1.5:1};
  this.ev(t,ST_LABEL[name],NEG.has(name)?'neg':'pos');return true;
 }
 arrivals(){
  [0,1].forEach(s=>{
   const side=this.sides[s],abs=this.units.filter(u=>u.side===s&&u.alive&&!u.present);if(!abs.length)return;
   const none=!this.units.some(u=>u.side===s&&u.alive&&u.present);
   if(side.actions>=3||none){
    const jl=(side.syn.jl||0)>=2;
    abs.forEach(u=>{u.present=true;u.gauge=0;this.say(`${this.nm(u)} arrive enfin${jl?' avec sa moitié':''}.`);const t=this.pick(u);if(t)this.hit(u,t,1.2*(jl?1.5:1));});
   }
  });
 }
 act(u,depth=0){
  if(!u.alive||!u.present||this.over)return;
  this.sides[u.side].actions++;
  const k=KIT[u.id]||{atk:B1(1)};let kind='atk';
  if(CHARGE.has(u.id)&&u.charge>=100){kind='ult';u.charge=0;}
  else if(SKILL_CD[u.id]&&u.cd<=0){kind='skill';u.cd=SKILL_CD[u.id];}
  if(kind!=='atk'){const kk=u.d.kit.find(x=>x[0]===(kind==='ult'?'Ulti':'Compétence'));this.fx.push({k:'act',uid:u.uid,name:kk?kk[1]:''});}
  (k[kind]||k.atk)(this,u);
  u.cd--;u.acts++;this.lastActor=u.uid;
  if(CHARGE.has(u.id)&&kind!=='ult')u.charge=Math.min(100,u.charge+20);
  if(u.alive&&u.st.stress){const d=Math.max(1,Math.round(u.maxhp*0.04*(u.st.stress.mul||1)));this.ev(u,'-'+d+' stress','neg');this.damage(u,d,null);}
  if(u.alive&&AFTER[u.id])AFTER[u.id](this,u);
  this.arrivals();this.checkEnd();
  if(u.id==='ryuk'&&u.alive&&depth<2&&!this.over&&this.rand()<0.35){this.ev(u,'Zoomies','pos');this.act(u,depth+1);}
 }
 checkEnd(){
  if(this.over)return;
  const a=this.units.some(u=>u.side===0&&u.alive),b=this.units.some(u=>u.side===1&&u.alive);
  if(!b)this.end(0);else if(!a)this.end(1);
 }
 end(w,reason){this.over=true;this.winner=w;this.reason=reason||'';}
 step(){
  if(this.over)return;
  this.t++;
  this.queue=this.queue.filter(q=>{if(q.at<=this.t){this.heal(q.u,q.amt,{queued:true});return false;}return true;});
  for(const u of this.units){
   if(!u.alive||!u.present)continue;
   for(const k in u.st){if(--u.st[k].t<=0)delete u.st[k];}
   if(u.st.calin&&this.t%10===0)this.heal(u,u.maxhp*0.02,{silent:true});
   if(u.st.malaise||u.st.attente)continue;
   u.gauge+=this.spd(u);
  }
  this.arrivals();
  let g=0;
  while(!this.over&&g++<30){
   const ready=this.units.filter(u=>u.alive&&u.present&&u.gauge>=1000&&!u.st.malaise&&!u.st.attente).sort((a,b)=>b.gauge-a.gauge);
   if(!ready.length)break;
   const u=ready[0];u.gauge-=1000;this.act(u);
  }
  this.checkEnd();
  if(this.t>=4000&&!this.over){this.say('Temps écoulé.');this.end(1,'Temps écoulé');}
 }
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rollW(w,r){const tot=Object.values(w).reduce((a,b)=>a+b,0);let x=r()*tot;for(const k in w){x-=w[k];if(x<0)return k;}return 'C';}
function genEnemies(n){
 const r=mulberry(n*7919+13),size=n<=2?3:n<=5?4:5,lvl=1+Math.floor((n-1)*0.8),stars=Math.min(5,Math.floor(n/15)),boss=n%10===0;
 const w={C:Math.max(15,70-3*n),R:25+n,E:Math.min(25,n),L:n>=8?Math.min(15,n-7):0};
 const ids=[];if(boss)ids.push(BYR.L[Math.floor(r()*BYR.L.length)].id);
 let g=0;while(ids.length<size&&g++<300){const rr=rollW(w,r);const list=BYR[rr].filter(c=>!ids.includes(c.id));if(!list.length)continue;ids.push(list[Math.floor(r()*list.length)].id);}
 return ids.map(id=>({id,lvl:lvl+(boss?2:0),stars}));
}

const SPR_CACHE={},SPR_H={};
function spr(id){
 if(SPR_CACHE[id])return SPR_CACHE[id];
 const c=CARD[id],[t,o,p]=LOOK[id]||['box'],rows=TPL[t](o||{});
 const pal=Object.assign({},BASEPAL,{T:ELC[c.el],C:ELC[c.el],H:'#3a2a20',F:'#888'},p||{});
 const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
 const cv=document.createElement('canvas');cv.width=w+2;cv.height=h+2;const x=cv.getContext('2d');
 x.fillStyle='#120b06';
 rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch!=='.')[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>x.fillRect(i+1+dx,y+1+dy,1,1));}));
 rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch==='.')return;x.fillStyle=pal[ch]||'#ff00ff';x.fillRect(i+1,y+1,1,1);}));
 SPR_H[id]=h+2;
 try{SPR_CACHE[id]=cv.toDataURL();}catch(e){SPR_CACHE[id]='';}
 return SPR_CACHE[id];
}

 return players;
}

/* ===== Onglet PvP ===== */
const parisDay=ms=>new Intl.DateTimeFormat('fr-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ms));
async function renderPvp(){
 const root=$('#tab-pvp');
 if(ME.is_admin){root.innerHTML='<div class="parch empty"><h2>Arène</h2><p class="muted">Le compte admin ne participe pas à l\'arène, pour ne pas fausser les cotes des joueurs.</p></div>';return;}
 const left=Math.max(0,5-(ME.pvp_day===parisDay(nowMs())?ME.pvp_used:0));
 const def=(ME.defense||[]).filter(id=>S.owned[id]);
 root.innerHTML=`<div class="pvp"><div class="parch pvp-me"><div class="row" style="justify-content:space-between"><div><h2>Arène</h2><p class="muted" style="margin:2px 0 0">Attaque la défense des autres. Victoire : +150 or, défaite : +30 or.</p></div>
  <div class="rating"><b>${ME.pvp_rating}</b><span>cote</span></div><div class="rating"><b>${left}/5</b><span>combats aujourd'hui</span></div></div>
  <div class="row" style="margin-top:12px;justify-content:space-between"><div><h3>Ta défense</h3><div class="row" style="gap:6px">${def.length?def.map(id=>miniFace(id,S.owned[id].lvl)).join(''):'<span class="muted">Aucune : ton équipe de combat sera utilisée.</span>'}</div></div>
  <button class="btn" id="set-def" ${!S.team.length?'disabled':''}>Mettre mon équipe en défense</button></div></div>
  <div id="pvp-list" class="pvp-list"><div class="panel empty muted">Chargement des adversaires…</div></div>
  <div class="panel"><h3 class="muted">Derniers combats</h3><div id="pvp-log" class="logl muted">…</div></div></div>`;
 $('#set-def').onclick=async()=>{try{await api('team',{ids:S.team,kind:'defense'});toast('Défense mise à jour.','good');renderPvp();}catch(e){toast(errMsg(e),'bad');}};
 try{
  const players=await loadPlayers(true),others=players.filter(p=>p.id!==ME.id).sort((a,b)=>b.pvp_rating-a.pvp_rating),names={};players.forEach(p=>names[p.id]=p.pseudo);
  const fightBusy=!!timer||!!nextTimer||busy;
  $('#pvp-list').innerHTML=others.length?others.map(p=>{const cs=CARDS_OF[p.id]||{};let d=(p.defense||[]).filter(id=>cs[id]);if(!d.length)d=(p.team||[]).filter(id=>cs[id]);const pw=d.reduce((a,id)=>a+power(id,cs[id]),0);
   return `<div class="foe el-${CARD[p.legend].el}"><span class="av big">${faceImg(p.legend)}</span><div class="foe-main"><div class="row" style="gap:8px"><b class="foe-name">${esc(p.pseudo)}</b><span class="tagc">${p.pvp_rating}</span><span class="muted" style="font-size:12px">${p.pvp_wins} V · ${p.pvp_losses} D · puissance ${fmt(pw)}</span></div><div class="row" style="gap:5px;margin-top:6px">${d.map(id=>miniFace(id,cs[id].lvl)).join('')||'<span class="muted">Pas de défense</span>'}</div></div><button class="btn primary" data-atk="${p.id}" ${!left||!d.length||!S.team.length||fightBusy?'disabled':''}>Attaquer</button></div>`;}).join(''):'<div class="panel empty muted">Personne d\'autre n\'a encore créé de compte. Envoie le lien à tes potes !</div>';
  if(fightBusy&&others.length)$('#pvp-list').insertAdjacentHTML('afterbegin','<p class="muted">Arrête le combat en cours dans l\'onglet Combat pour attaquer.</p>');
  $('#pvp-list').querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>attack(b.dataset.atk));
  const {data:logs}=await sb.from('pvp_log').select('*').or(`attacker.eq.${ME.id},defender.eq.${ME.id}`).order('at',{ascending:false}).limit(12);
  $('#pvp-log').innerHTML=(logs||[]).map(l=>{const att=l.attacker===ME.id,won=att?l.win:!l.win,d=att?l.delta:-l.delta;return `<div><span class="${won?'s0':'s1'}">${won?'Victoire':'Défaite'}</span> ${att?'contre':'en défense face à'} <b>${esc(names[att?l.defender:l.attacker]||'?')}</b> · ${d>=0?'+':''}${d} · <span class="mono">${new Date(l.at).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</span></div>`;}).join('')||'Aucun combat pour l\'instant.';
 }catch(e){$('#pvp-list').innerHTML=`<div class="panel empty muted">${esc(errMsg(e))}</div>`;}
}
async function attack(target){
 if(timer||busy)return;busy=true;$('#pvp-list').querySelectorAll('[data-atk]').forEach(b=>b.disabled=true);
 let j;try{j=await api('pvp',{target},{noApply:true});}catch(e){busy=false;toast(errMsg(e),'bad');renderPvp();return;}
 busy=false;const bt=j.battle,root=$('#overlay-root');
 root.innerHTML=`<div class="overlay"><div class="pvp-fight"><div id="pvp-arena"></div><div id="pvp-res" class="row" style="justify-content:center;margin-top:10px"></div></div></div>`;
 runBattle(new Battle(bt.team,bt.enemies,bt.seed),'#pvp-arena',`Arène · ${esc(bt.targetPseudo)}`,()=>{
  applyServer(j);
  if(!$('#pvp-res')){toast(`${bt.win?'Victoire':'Défaite'} contre ${bt.targetPseudo} · cote ${bt.delta>=0?'+':''}${bt.delta}`,bt.win?'good':'bad');B=null;RUN=null;if(tab==='pvp')renderPvp();return;}
  $('#pvp-res').innerHTML=`<div class="result ${bt.win?'win':'lose'}"><div><b>${bt.win?'Victoire':'Défaite'} contre ${esc(bt.targetPseudo)}</b><div class="muted">Cote ${bt.delta>=0?'+':''}${bt.delta} · +${bt.gold} or</div></div><button class="btn primary" id="pvp-close">Fermer</button></div>`;
  $('#pvp-close').onclick=()=>{closeSheet();B=null;RUN=null;renderPvp();};
 });
}

/* ===== Onglet Admin ===== */
let resetArm=false;
function renderAdmin(){
 const root=$('#tab-admin');if(!ME||!ME.is_admin){root.innerHTML='';return;}
 root.innerHTML=`<div class="parch admin"><h2>Outils admin</h2><p class="muted" style="margin:4px 0 14px">Ces outils n'agissent que sur ce compte. Il est caché des classements et de l'arène, et n'a pas de délai entre les combats.</p>
 <div class="adm-grid">
  <form class="adm-box" id="ad-grant"><h3>Ressources</h3><label for="ad-gold">Or</label><input id="ad-gold" type="number" min="0" value="10000"><label for="ad-tix">Tickets</label><input id="ad-tix" type="number" min="0" value="50"><button class="btn primary" type="submit">Ajouter</button></form>
  <form class="adm-box" id="ad-floor"><h3>Progression</h3><label for="ad-fl">Étage max débloqué</label><input id="ad-fl" type="number" min="0" max="500" value="${S.maxFloor}"><button class="btn primary" type="submit">Appliquer</button></form>
  <form class="adm-box" id="ad-card"><h3>Héros</h3><label for="ad-c">Héros</label><select id="ad-c">${CARDS.map(c=>`<option value="${c.id}">${esc(c.name)} · ${RAR[c.r].n}</option>`).join('')}</select><div class="row" style="gap:8px"><div style="flex:1"><label for="ad-l">Niveau</label><input id="ad-l" type="number" min="1" max="300" value="10"></div><div style="flex:1"><label for="ad-s">Étoiles</label><input id="ad-s" type="number" min="0" max="5" value="0"></div></div><button class="btn primary" type="submit">Donner ou modifier</button></form>
  <form class="adm-box" id="ad-all"><h3>Collection complète</h3><label for="ad-al">Niveau de tous les héros</label><input id="ad-al" type="number" min="1" max="300" value="1"><button class="btn primary" type="submit">Débloquer les ${CARDS.length} héros</button></form>
 </div>
 <div class="adm-box danger" style="margin-top:14px"><h3>Remise à zéro</h3><p class="muted" style="margin:0 0 8px">Remet ce compte à son état de départ : légendaire seule, ${500} or, 10 tickets, étage 0.</p><button class="btn" id="ad-reset">${resetArm?'Confirmer : tout remettre à zéro':'Remettre à zéro'}</button></div></div>`;
 const run=async(action,body,ok)=>{try{await api(action,body);toast(ok,'good');renderAdmin();}catch(e){toast(errMsg(e),'bad');}};
 $('#ad-grant').onsubmit=e=>{e.preventDefault();run('admin_grant',{gold:$('#ad-gold').value,tickets:$('#ad-tix').value},'Ressources ajoutées.');};
 $('#ad-floor').onsubmit=e=>{e.preventDefault();sel=null;run('admin_floor',{floor:$('#ad-fl').value},'Étage mis à jour.');};
 $('#ad-card').onsubmit=e=>{e.preventDefault();run('admin_card',{card:$('#ad-c').value,lvl:$('#ad-l').value,stars:$('#ad-s').value},'Héros mis à jour.');};
 $('#ad-all').onsubmit=e=>{e.preventDefault();run('admin_all',{lvl:$('#ad-al').value},'Collection complète débloquée.');};
 $('#ad-reset').onclick=()=>{if(!resetArm){resetArm=true;renderAdmin();setTimeout(()=>{resetArm=false;if(tab==='admin')renderAdmin();},4000);return;}resetArm=false;sel=null;lastPull=null;run('admin_reset',{},'Compte remis à zéro.');};
}

/* ===== Onglet Classements ===== */
let rankKind='floor';
const RANKS={floor:{t:'Plus loin',k:p=>p.max_floor,f:p=>`Étage ${p.max_floor}`},collection:{t:'Collection',k:p=>p.collection_score,f:p=>`${p.collection_count}/${CARDS.length} · ${p.collection_score} pts`},pvp:{t:'Arène',k:p=>p.pvp_rating,f:p=>`${p.pvp_rating} · ${p.pvp_wins} V / ${p.pvp_losses} D`}};
async function renderRank(){
 const root=$('#tab-rank');
 root.innerHTML=`<div class="parch"><div class="row" style="justify-content:space-between"><h2>Classements</h2><div class="seg" id="rk">${Object.keys(RANKS).map(k=>`<button data-k="${k}" aria-pressed="${rankKind===k}">${RANKS[k].t}</button>`).join('')}</div></div><div id="rk-body"><p class="muted">Chargement…</p></div>
 <p class="muted" style="font-size:12px;margin:12px 0 0">Collection : chaque héros rapporte des points selon sa rareté (1, 2, 4 ou 8), multipliés par 2 + ses étoiles.</p></div>`;
 root.querySelectorAll('#rk button').forEach(b=>b.onclick=()=>{rankKind=b.dataset.k;renderRank();});
 try{
  const R=RANKS[rankKind],ps=(await loadPlayers(false)).sort((a,b)=>R.k(b)-R.k(a)||a.pseudo.localeCompare(b.pseudo));
  const pod=[ps[1],ps[0],ps[2]].map((p,i)=>{if(!p)return '<div class="podium-slot"></div>';const rank=[2,1,3][i];return `<div class="podium-slot r${rank}${p.id===ME.id?' me':''}"><div class="pfig">${figImg(p.legend)}</div><div class="pblock"><b>${rank}</b></div><div class="pname">${esc(p.pseudo)}</div><div class="pval">${R.f(p)}</div></div>`;}).join('');
  $('#rk-body').innerHTML=`<div class="podium">${pod}</div><ol class="rank-list">${ps.map((p,i)=>`<li class="${p.id===ME.id?'me':''}"><span class="pos">${i+1}</span><span class="av">${faceImg(p.legend)}</span><b>${esc(p.pseudo)}</b><span class="val">${R.f(p)}</span></li>`).join('')}</ol>`;
 }catch(e){$('#rk-body').innerHTML=`<p class="muted">${esc(errMsg(e))}</p>`;}
}

/* ===== Connexion et création du compte ===== */
function showAuth(modeA='login',msg=''){
 document.body.classList.add('logged-out');
 $('#auth-root').innerHTML=`<div class="auth"><div class="parch auth-card"><div class="auth-art">${['jenlain','yoann','lea','kylian','geoffrey','lila'].map(id=>`<img class="px" src="${ART[id]&&ART[id].px?ART[id].px:spr(id)}" alt="">`).join('')}</div>
  <h2 style="text-align:center">Gacha entre potes</h2>
  <div class="seg" style="margin:10px auto;display:flex;width:max-content"><button data-m="login" aria-pressed="${modeA==='login'}">Connexion</button><button data-m="signup" aria-pressed="${modeA==='signup'}">Créer un compte</button></div>
  <form id="auth-form" class="auth-form"><label for="a-pseudo">Pseudo</label><input id="a-pseudo" autocomplete="username" required minlength="2" maxlength="20"><label for="a-pass">Mot de passe</label><input id="a-pass" type="password" autocomplete="${modeA==='login'?'current-password':'new-password'}" required minlength="6">
  <button class="btn primary" type="submit" id="a-go">${modeA==='login'?'Se connecter':'Créer mon compte'}</button><p class="auth-msg" id="a-msg">${esc(msg)}</p>
  <p class="muted" style="font-size:12px;margin:0">${modeA==='login'?'Ton compte suit ton pseudo : connecte-toi avec les mêmes identifiants sur téléphone et sur ordinateur.':'Choisis bien ton mot de passe : il n\'y a pas de récupération par e-mail.'}</p></form></div></div>`;
 $('#auth-root').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
 $('#auth-form').onsubmit=async e=>{
  e.preventDefault();const pseudo=$('#a-pseudo').value.trim(),pass=$('#a-pass').value,go=$('#a-go');go.disabled=true;$('#a-msg').textContent='';
  try{
   if(modeA==='signup'){const {error}=await sb.auth.signUp({email:emailOf(pseudo),password:pass});if(error)throw error;pendingPseudo=pseudo;}
   else{const {error}=await sb.auth.signInWithPassword({email:emailOf(pseudo),password:pass});if(error)throw error;}
   await boot();
  }catch(err){go.disabled=false;const m=String(err.message||'');$('#a-msg').textContent=/registered|exists/i.test(m)?'Ce pseudo est déjà pris.':/invalid login|credentials/i.test(m)?'Pseudo ou mot de passe incorrect.':/confirm|email address .* is invalid/i.test(m)?'Inscription bloquée : la confirmation par e-mail est encore activée dans Supabase.':m||'Connexion impossible.';}
 };
}
let pendingPseudo='',pickLegend=null;
function showCreate(){
 document.body.classList.add('logged-out');
 $('#auth-root').innerHTML=`<div class="auth"><div class="parch auth-card wide"><div class="ribbon">Choisis ta légendaire</div><p class="muted" style="text-align:center;margin:-4px 0 12px">Celle qui te correspond. Elle sera ton premier héros et ton avatar.</p>
  <div class="banners pick">${BYR.L.map(c=>bannerHTML(c.id,{reveal:true,noLv:true})).join('')}</div>
  <form id="c-form" class="auth-form" style="max-width:340px;margin:16px auto 0"><label for="c-pseudo">Pseudo affiché</label><input id="c-pseudo" required minlength="2" maxlength="20" value="${esc(pendingPseudo)}"><button class="btn primary" id="c-go" type="submit" disabled>Commencer l'aventure</button><p class="auth-msg" id="c-msg"></p><button class="btn small" type="button" id="c-out">Se déconnecter</button></form></div></div>`;
 const pick=$('#auth-root .pick');
 pick.querySelectorAll('.banner').forEach(b=>b.onclick=()=>{pickLegend=b.dataset.id;pick.querySelectorAll('.banner').forEach(x=>x.classList.toggle('chosen',x===b));$('#c-go').disabled=false;});
 $('#c-out').onclick=async()=>{await sb.auth.signOut();showAuth();};
 $('#c-form').onsubmit=async e=>{e.preventDefault();if(!pickLegend)return;$('#c-go').disabled=true;try{await api('create',{pseudo:$('#c-pseudo').value.trim(),legend:pickLegend});enterGame();}catch(err){$('#c-msg').textContent=errMsg(err);$('#c-go').disabled=false;}};
}
function enterGame(){
 document.body.classList.remove('logged-out');$('#auth-root').innerHTML='';
 showTab(Object.keys(S.owned).length>1||S.maxFloor?'combat':'invoc');
}
$('#logout').onclick=async()=>{if(timer){clearInterval(timer);timer=null;}if(nextTimer){clearTimeout(nextTimer);nextTimer=null;}B=null;ME=null;await sb.auth.signOut();showAuth();};
async function boot(){
 const {data}=await sb.auth.getSession();if(!data||!data.session){showAuth();return;}
 try{const j=await api('state');if(!j.profile)showCreate();else enterGame();}
 catch(e){if(e.error==='auth'){await sb.auth.signOut();showAuth();}else showAuth('login',errMsg(e));}
}
if(!CONFIGURED){document.body.classList.add('logged-out');$('#auth-root').innerHTML='<div class="auth"><div class="parch auth-card"><h2>Serveur non configuré</h2><p class="muted">Il manque l\'adresse du serveur Supabase dans cette page.</p></div></div>';}
else{boot();setInterval(renderHeader,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME&&!timer&&!busy&&!nextTimer)api('state').then(()=>{if(tab!=='combat')refresh();}).catch(()=>{});});}

/* ===== Application Android ===== */
(async()=>{
 const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
 document.body.classList.add('native');const App=C.Plugins&&C.Plugins.App;if(!App)return;
 App.addListener('backButton',()=>{
  const l=document.querySelector('.lightbox');if(l){l.remove();return;}
  if(document.querySelector('#stage-root .stage'))return;
  if($('#overlay-root').innerHTML){if(RUN&&RUN.root==='#pvp-arena'&&timer)return;closeSheet();return;}
  if(!document.body.classList.contains('logged-out')&&tab!=='combat'){showTab('combat');return;}
  App.exitApp();
 });
 try{
  const info=await App.getInfo(),j=await (await fetch('apk.json',{cache:'no-store'})).json();
  const newer=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);}return false;};
  if(newer(j.version,info.version)){const d=document.createElement('div');d.className='apk-banner';d.innerHTML=`<span>Une nouvelle version de l'application est disponible.</span><a class="btn small gold" href="${j.url}" target="_blank" rel="noopener">Télécharger</a><button class="btn small" aria-label="Fermer">×</button>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);}
 }catch(e){}
})();

</script>
</body></html>
