name: Serveur Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/schema.sql', 'supabase/config.toml', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Mettre à jour la base (schema.sql)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          BODY=$(jq -Rs '{query: .}' supabase/schema.sql)
          CODE=$(curl -s -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/hdnikqelkznukdwjmyde/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          cat out.json; echo
          if [ "$CODE" -ge 300 ]; then echo "::error::Mise à jour de la base refusée ($CODE)"; exit 1; fi
      - name: Déployer la fonction game
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ajoute le secret SUPABASE_ACCESS_TOKEN dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy game --project-ref hdnikqelkznukdwjmyde --use-api
