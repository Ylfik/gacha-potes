name: Serveur Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer la fonction game
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ajoute le secret SUPABASE_ACCESS_TOKEN dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy game --project-ref hdnikqelkznukdwjmyde --use-api
