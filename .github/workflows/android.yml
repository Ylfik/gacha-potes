name: APK Android

on:
  push:
    branches: [main]
    paths: ['android-shell/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Kit Android déjà présent sur la machine
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Vérifier la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Ajoute les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Préparer le projet Android
        working-directory: android-shell
        run: |
          npm install
          npx cap add android
          cp -r res/. android/app/src/main/res/
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          npx cap sync android

      - name: Compiler
        working-directory: android-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ks.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android-shell/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-key-alias gachapotes --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out gacha-potes.apk aligned.apk
          "$BT/apksigner" verify gacha-potes.apk
          rm ks.jks

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION }}-${{ github.run_number }}
          name: Application Android ${{ env.VERSION }}
          body: |
            Télécharge **gacha-potes.apk** ci-dessous et installe-le sur ton téléphone Android.
            Le jeu lui-même se met à jour tout seul à chaque lancement : il ne faut réinstaller l'application que quand le jeu te le propose.
          files: gacha-potes.apk
          make_latest: true
